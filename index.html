<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>European Champions Report 2026 · Abdoul Hamid Diallo</title>
<meta name="description" content="L'édition interactive du European Champions Report 2026 : les dix champions nationaux européens de la saison 2025/26, leur domination, leur parcours européen, leurs finances et leur valeur.">
<meta name="theme-color" content="#050b16">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050b16'/%3E%3Cpath d='M32 9l6.2 12.6 13.8 2-10 9.8 2.4 13.8L32 40.7l-12.4 6.5L22 33.4l-10-9.8 13.8-2z' fill='%23f0b429'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#050b16;--s1:#0a1426;--s2:#0f1d35;--s3:#132544;--line:#1a2a45;--line2:#243757;--ink:#f4f7fc;--ink2:#aab6ca;--ink3:#72819b;--gold:#f0b429;--gold2:#ffd36e;--acc:#4f8cff;--acc2:rgba(79,140,255,.14);--pos:#34d399;--neg:#f87171;--bar:#44639c;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.6)}
:root[data-theme="light"]{--bg:#eef1f6;--s1:#ffffff;--s2:#f5f7fb;--s3:#e9eef6;--line:#e1e6ee;--line2:#cfd7e3;--ink:#0a1426;--ink2:#43506a;--ink3:#67758d;--gold:#b7860b;--gold2:#8a6408;--acc:#1d4ed8;--acc2:rgba(29,78,216,.1);--pos:#047857;--neg:#b42318;--bar:#7093c6;--sh:0 1px 2px rgba(16,24,40,.05),0 16px 32px -20px rgba(16,24,40,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .25s}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,select:focus-visible,th:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:10px;z-index:99;background:var(--gold);color:#1a1200;padding:8px 12px;border-radius:8px;font-weight:600}button{font:inherit;color:inherit}
.disp{font-family:Sora,Inter,system-ui,sans-serif;letter-spacing:-.025em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.gold{color:var(--gold)}.mut{color:var(--ink3)}.pos{color:var(--pos)}.neg{color:var(--neg)}
/* header */
header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 22px}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap;flex:none}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#12264a,#07101f);border:1px solid rgba(240,180,41,.35);display:grid;place-items:center;box-shadow:0 0 24px -8px rgba(240,180,41,.5)}
.brand b{font-family:Sora;font-weight:800;font-size:15px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--ink3);font-size:11px;letter-spacing:.02em}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;justify-content:flex-start;padding:2px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--ink2);padding:8px 13px;border-radius:99px;font-size:13.5px;font-weight:500;white-space:nowrap;transition:.15s}
nav.tabs a:hover{color:var(--ink);background:var(--s2)}
nav.tabs a.on{color:var(--bg);background:var(--ink);font-weight:600}
nav.tabs a.rep{color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent)}
nav.tabs a.rep.on{background:var(--gold);color:#050b16}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--line2);background:var(--s1);cursor:pointer;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{color:var(--ink);border-color:var(--ink3)}
.search{position:relative;flex:none}
.search input{width:210px;background:var(--s1);border:1px solid var(--line2);color:var(--ink);border-radius:11px;padding:9px 12px;font:inherit;font-size:13.5px}
.search input:focus{outline:2px solid var(--acc);outline-offset:1px}
.sres{position:absolute;right:0;top:46px;width:320px;background:var(--s1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);padding:6px;display:none}
.sres a{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px}
.sres a:hover,.sres a.on{background:var(--s3)}
main{max-width:1380px;margin:0 auto;padding:30px 26px 110px}
.logo{object-fit:contain;display:block;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;padding:64px 58px 48px;background:radial-gradient(900px 480px at 78% 40%,rgba(79,140,255,.18),transparent 60%),radial-gradient(700px 400px at 10% 110%,rgba(240,180,41,.12),transparent 60%),linear-gradient(180deg,#0b1730,#060d1b);border:1px solid #1a2a45;color:#f4f7fc;isolation:isolate}
.hero .pitch{position:absolute;inset:0;z-index:-1;opacity:.07}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:#ffd36e;border:1px solid rgba(240,180,41,.35);background:rgba(240,180,41,.06);padding:6px 12px;border-radius:99px}
.hero h1{font-family:Sora;font-weight:800;font-size:clamp(40px,5.6vw,80px);line-height:.95;letter-spacing:-.045em;margin:22px 0 18px}
.hero h1 span{display:block}
.hero h1 .g{background:linear-gradient(90deg,#ffd36e,#f0b429 50%,#d99413);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:#b9c5d9;font-size:17.5px;max-width:560px;margin:0 0 28px;line-height:1.6}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 18px;border-radius:12px;font-weight:600;font-size:14.5px;border:1px solid transparent;cursor:pointer;transition:.15s;white-space:nowrap}
.btn.p{background:linear-gradient(180deg,#ffcf5a,#f0b429);color:#1a1200;box-shadow:0 10px 30px -12px rgba(240,180,41,.7)}
.btn.p:hover{transform:translateY(-1px)}
.btn.g{border-color:rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.04)}.btn.g:hover{background:rgba(255,255,255,.1)}
.btn.s{background:var(--s1);border-color:var(--line2);color:var(--ink)}.btn.s:hover{border-color:var(--ink3)}
.orbit{position:relative;aspect-ratio:1;max-width:540px;margin:0 auto;width:100%}
.orbit .ring{position:absolute;inset:8%;border-radius:50%;border:1px dashed rgba(255,255,255,.12)}
.orbit .ring.r2{inset:24%;border-style:solid;border-color:rgba(240,180,41,.18)}
.orbit .center{position:absolute;inset:32%;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1c3566,#0a1426 70%);border:1px solid rgba(240,180,41,.35);display:grid;place-items:center;text-align:center;box-shadow:0 0 80px -10px rgba(240,180,41,.35)}
.orbit .center b{font-family:Sora;font-size:clamp(34px,4.5vw,58px);font-weight:800;line-height:1;letter-spacing:-.04em}
.orbit .center span{display:block;color:#aab6ca;font-size:12px}.orbit .center .mono{color:#ffd36e;margin-bottom:4px}
.orb{position:absolute;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.96);display:grid;place-items:center;box-shadow:0 14px 30px -12px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.2);transition:transform .2s;cursor:pointer}
.orb:hover{transform:translate(-50%,-50%) scale(1.12);z-index:3}
.orb img{width:72%;height:72%;object-fit:contain}
.hstats{display:grid;grid-template-columns:repeat(5,1fr);margin-top:40px;border-top:1px solid rgba(255,255,255,.1)}
.hstats div{padding:22px 18px 0 0}
.hstats b{display:block;font-family:Sora;font-weight:700;font-size:clamp(24px,2.6vw,36px);letter-spacing:-.03em;color:#fff}
.hstats>div>span{display:block;color:#8fa0bb;font-size:12.5px;margin-top:4px}
/* sections */
.sec{margin-top:66px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.sh h2{font-family:Sora;font-weight:700;font-size:clamp(24px,2.6vw,34px);letter-spacing:-.03em;margin:6px 0 0;line-height:1.1}
.sh p{margin:6px 0 0;color:var(--ink2);max-width:680px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--sh);min-width:0;position:relative}
.card h3{margin:0;font-family:Sora;font-size:17px;font-weight:600;letter-spacing:-.015em}
.card .sub{color:var(--ink3);font-size:13px;margin:4px 0 16px}
.grid{display:grid;gap:20px}.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g5{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.span2{grid-column:span 2}
/* page head */
.ph{position:relative;border-radius:24px;overflow:hidden;padding:46px 46px 42px;margin-bottom:26px;background:linear-gradient(135deg,var(--s2),var(--s1));border:1px solid var(--line)}
.ph .num{position:absolute;right:30px;top:10px;font-family:Sora;font-weight:800;font-size:140px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--line2);letter-spacing:-.05em}
.ph h1{font-family:Sora;font-weight:800;font-size:clamp(32px,4.6vw,58px);letter-spacing:-.04em;line-height:1;margin:14px 0 12px;max-width:900px}
.ph p{margin:0;color:var(--ink2);max-width:760px;font-size:16.5px}
/* podium */
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;align-items:end;min-height:340px}
.pod{border-radius:18px 18px 6px 6px;padding:18px;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);background:linear-gradient(180deg,var(--s2),var(--s1))}
.pod .logo{width:74px;height:74px}
.pod.p1{min-height:320px;border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 16%,var(--s2)),var(--s1))}
.pod.p1 .logo{width:96px;height:96px}
.pod.p2{min-height:260px}.pod.p3{min-height:220px}
.pod .rk{font-family:Sora;font-weight:800;font-size:44px;line-height:1;color:var(--ink3)}
.pod.p1 .rk{color:var(--gold)}
.pod .sc{font-family:Sora;font-weight:700;font-size:28px}
.pod small{color:var(--ink3)}
/* champion card */
.cc{overflow:hidden;padding:0;cursor:pointer;transition:transform .2s,border-color .2s;display:flex;flex-direction:column}
.cc:hover{transform:translateY(-4px);border-color:var(--line2)}
.cc .top{position:relative;height:150px;display:grid;place-items:center;overflow:hidden}
.cc .top .wm{position:absolute;width:210px;height:210px;right:-50px;bottom:-60px;opacity:.16;filter:grayscale(.2)}
.cc .top .logo{width:92px;height:92px;position:relative;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.cc .lg{position:absolute;left:14px;top:12px;color:rgba(255,255,255,.85)}
.cc .rank{position:absolute;right:14px;top:10px;font-family:Sora;font-weight:800;color:rgba(255,255,255,.9);font-size:13px;background:rgba(0,0,0,.25);padding:3px 9px;border-radius:99px}
.cc .bd{padding:16px 18px 18px}
.cc .nm{font-family:Sora;font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.15}
.cc .co{color:var(--ink3);font-size:12.5px;margin-top:2px}
.cc .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.cc .kv span{font-size:11px;color:var(--ink3)}.cc .kv b{display:block;font-family:Sora;font-size:17px;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--gold) 15%,transparent);color:var(--gold)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
/* charts */
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{font-family:Inter,system-ui,sans-serif;fill:var(--ink2);font-size:12px}
svg.ch .lbl{fill:var(--ink);font-weight:600}
svg.ch .val{fill:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
svg.ch .gl line{stroke:var(--line)}
svg.ch .axis{stroke:var(--line2)}
svg.ch .mk{fill:var(--bar);transition:fill .15s}
svg.ch .mk.hi{fill:var(--gold)}
svg.ch g.hit{cursor:pointer}
svg.ch g.hit:hover .mk:not(.hi){fill:var(--acc)}
svg.ch g.hit:hover .lbl{fill:var(--acc)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:99;pointer-events:none;background:#f4f7fc;color:#0a1426;padding:9px 12px;border-radius:10px;font-size:12.5px;line-height:1.45;box-shadow:0 18px 40px -14px rgba(0,0,0,.6);opacity:0;transition:opacity .1s;max-width:270px}
/* insights */
.ins{display:grid;grid-template-columns:54px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0;padding-top:4px}
.ins .n{font-family:Sora;font-weight:800;font-size:22px;color:var(--gold);white-space:nowrap}
.ins b{display:block;font-family:Sora;font-weight:600;font-size:15.5px;letter-spacing:-.01em;margin-bottom:3px}
.ins p{margin:0;color:var(--ink2);font-size:14px}
/* map */
.mapc svg{width:100%;height:auto;display:block}
.land{fill:var(--s3);stroke:var(--bg);stroke-width:.8}
.land.ch{fill:color-mix(in srgb,var(--acc) 26%,var(--s3))}
.pin{cursor:pointer}.pin:hover .pl{transform:scale(1.15)}
.pl{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.pulse{fill:none;stroke:var(--gold);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pu 2.8s ease-out infinite}
@keyframes pu{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
/* timeline */
.tl{position:relative;padding:6px 0}
.tl .ax{position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line2)}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:11px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--s2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);cursor:pointer;user-select:none}
th:hover{color:var(--ink)}th.l,td.l{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--s2)}
td .cl{display:flex;align-items:center;gap:10px;font-weight:600}
/* club */
.chead{position:relative;overflow:hidden;border-radius:26px;padding:38px 40px;color:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center;margin-bottom:18px;isolation:isolate}
.chead .wm{position:absolute;right:-80px;top:-90px;width:460px;height:460px;opacity:.12;z-index:-1}
.chead .badge{width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.97);display:grid;place-items:center;padding:20px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6)}
.chead .badge img{width:100%;height:100%;object-fit:contain}
.chead h1{font-family:Sora;font-weight:800;font-size:clamp(32px,4.6vw,60px);letter-spacing:-.04em;margin:8px 0 8px;line-height:1}
.chead .meta{color:rgba(255,255,255,.85)}
.chead .big{text-align:right}
.chead .big b{font-family:Sora;font-size:84px;font-weight:800;line-height:.9;display:block;letter-spacing:-.05em}
.wt{background:rgba(255,255,255,.14)!important;color:#fff!important}
.facts{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--s1)}
.facts div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts span{display:block;color:var(--ink3);font-size:12px}
.facts b{font-family:Sora;font-size:18px;font-weight:600;letter-spacing:-.01em}
.path{display:flex;overflow-x:auto;padding:6px 0 2px}
.step{flex:1;min-width:130px;position:relative;padding:14px 12px 0}
.step:before{content:"";position:absolute;top:24px;left:0;right:0;height:2px;background:var(--line2)}
.step .dot{position:relative;width:20px;height:20px;border-radius:50%;background:var(--s1);border:3px solid var(--acc);margin-bottom:12px}
.step.l .dot{border-color:var(--neg)}.step.w .dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 18px var(--gold)}
.step small{display:block;color:var(--ink3);font-size:12px}.step b{font-family:Sora;font-size:15px}
.pill{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--acc2);color:var(--acc)}
.step.l .pill{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.step.w .pill{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.rrow{display:grid;grid-template-columns:1fr auto 54px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.rrow b{font-variant-numeric:tabular-nums}
/* duel */
select{background:var(--s1);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;max-width:100%}
.duelhead{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.dside{display:flex;flex-direction:column;align-items:center;gap:12px}
.dside .logo{width:96px;height:96px}
.vs{font-family:Sora;font-weight:800;font-size:44px;letter-spacing:-.04em;text-align:center}
.vs small{display:block;font-size:11px;color:var(--ink3);letter-spacing:.1em;font-family:"JetBrains Mono"}
.drow{display:grid;grid-template-columns:1fr 170px 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.drow .m{text-align:center;color:var(--ink3);font-size:12.5px}
.drow .a,.drow .b{display:flex;align-items:center;gap:10px}.drow .a{justify-content:flex-end}
.drow .t{height:10px;border-radius:5px;background:var(--bar)}
.drow .win .t{background:var(--gold)}
.drow span{min-width:60px;font-weight:700;font-family:Sora}.drow .a span{text-align:right}
/* report */
.rwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}.rwrap>div{min-width:0}#rps{max-width:100%}
.toc{position:sticky;top:78px;max-height:calc(100vh - 100px);overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:10px}
.toc a{display:grid;grid-template-columns:28px 1fr;gap:6px;padding:7px 8px;border-radius:9px;font-size:13px;color:var(--ink2)}
.toc a span{color:var(--ink3);font-family:"JetBrains Mono";font-size:11px;padding-top:2px}
.toc a:hover{background:var(--s2);color:var(--ink)}
.toc a.on{background:var(--ink);color:var(--bg)}.toc a.on span{color:var(--bg)}
.toc .ch{margin:10px 8px 4px;color:var(--gold)}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.prog{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--gold)}
.rp{container-type:inline-size;aspect-ratio:16/9;width:100%;border-radius:14px;overflow:hidden;position:relative;background:#f7f8fb;color:#0a1426;box-shadow:0 30px 70px -30px rgba(0,0,0,.7);

 return `<section class="hero fade">${PITCH}<div class="hero-grid"><div>
 <span class="eyebrow mono">${STAR(14)} Édition 2026 · Saison 2025/26</span>
 <h1><span>European</span><span>Champions</span><span class="g">Report 2026</span></h1>
 <p class="lead">Les dix champions nationaux d'Europe, du Bayern au Club Brugge, analysés sous tous les angles : domination, parcours européen, finances et valeur. Un rapport de ${RPAGES.length} pages et une application où chaque chiffre s'explore.</p>

 <section class="sec"><div class="sh"><div><div class="mono gold">Le podium</div><h2>Qui a le plus dominé son championnat ?</h2><p>L'Indice ECR de domination réunit points par match, écart avec le dauphin, différence de buts et rareté des défaites.</p></div><a class="btn s" href="#/domination">Voir le classement complet →</a></div>
 <div class="grid g2"><div class="card">${podium()}</div><div class="card">${insHTML()}</div></div></section>

 <section class="sec"><div class="sh"><div><div class="mono gold">La carte</div><h2>Dix couronnes, d'Istanbul à Glasgow</h2><p>Et le calendrier des sacres : du PSV, champion dès le 5 avril, au Club Brugge, couronné le 21 mai.</p></div></div>

 <section class="sec"><div class="sh"><div><div class="mono gold">Les champions</div><h2>Les dix fiches</h2></div><a class="btn s" href="#/champions">Tout voir →</a></div><div class="grid g5">${DOM.map(champCard).join("")}</div></section>

 <section class="sec"><div class="banner"><div><span class="mono" style="color:#ffd36e">Le rapport complet</span><h2>${RPAGES.length} pages, prêtes à présenter ou imprimer</h2><p>Mode lecture page par page, plein écran, navigation au clavier et export PDF.</p><div class="cta" style="margin-top:18px"><a class="btn p" href="#/rapport/1">Ouvrir le rapport</a></div></div><div class="minis"><div><i></i><i></i></div><div><i></i><i></i></div><div><i></i><i></i></div></div></div></section>`;
};

pages.decennie=()=>{
 const open=[...DEC_DIST].sort((a,b)=>b.n-a.n)[0],closed=[...DEC_DIST].sort((a,b)=>a.n-b.n)[0];
 return PH("+10","Chapitre 2 bis","Dix ans de domination","Qui règne vraiment sur chaque championnat ? Les dix derniers titres de chacune des dix ligues, saison par saison, et le degré d'ouverture de chaque compétition.")+
 `<div class="grid fade" style="grid-template-columns:1fr">${card("Les champions depuis 2016/17","Une case par saison et par championnat, aux couleurs du club vainqueur",heatmap())}</div>
 <div class="grid g2" style="margin-top:16px">
 ${card("Titres sur dix saisons","Clubs les plus titrés de la décennie dans ces dix championnats",decbar())}
 ${card("Concurrence : champions différents en dix ans","Plus la barre est longue, plus le championnat est ouvert",distbar())}
 <section class="card span2"><h3>Ce que révèle la décennie</h3><p class="sub">Lecture des dix dernières saisons</p>
 <div class="ins"><div class="n">9/10</div><div><b>Bayern et Celtic, deux hégémonies</b><p>Neuf titres sur dix chacun. Seuls le Bayer Leverkusen (2024) et les Rangers (2021) ont brisé la série.</p></div></div>
 <div class="ins"><div class="n">${closed.n}</div><div><b>${esc(closed.league)}, le championnat le plus verrouillé</b><p>Seulement ${closed.n} vainqueurs différents en dix saisons.</p></div></div>
 <div class="ins"><div class="n">${open.n}</div><div><b>${esc(open.league)}, le plus ouvert</b><p>${open.n} clubs différents sacrés en dix ans : Anderlecht, Club Brugge, Genk, Antwerp et l'Union SG.</p></div></div>
 <div class="ins"><div class="n">4</div><div><b>Quatre couronnes surprises</b><p>Monaco (2017), Lille (2021), Başakşehir (2020) et l'Union SG (2025) ont fait tomber des favoris installés.</p></div></div>
 <div class="ins"><div class="n">6/10</div><div><b>Six championnats à trois clubs maximum</b><p>Sur 99 titres attribués en dix saisons, 33 clubs différents seulement ont été sacrés, et dans six de ces dix ligues trois clubs se partagent tout.</p></div></div>

pages.champions=()=>PH("01","Chapitre 1","Les dix champions 2025/26","Classés selon l'Indice ECR de domination. Ouvrez une fiche pour le dossier complet du club.")+
 `<section class="card fade" style="margin-bottom:20px"><h3>Les couleurs des champions</h3><p class="sub">Maillots stylisés aux couleurs officielles de chaque club</p><div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">${DOM.map(c=>`<a href="#/club/${c.id}" style="text-align:center;min-width:86px" data-tip="${esc(TT(c,esc(c.league)))}">${jersey(c,72)}<div style="font-size:12.5px;color:var(--ink2);margin-top:6px">${esc(c.short)}</div></a>`).join("")}</div></section>
 <div class="grid g5 fade">${DOM.map(champCard).join("")}</div><p class="note">* Club Brugge : points des play-offs pour le titre.</p>

pages.domination=()=>PH("02","Chapitre 2","Domination sportive","Indice ECR : points par match 35 %, écart avec le dauphin par match 25 %, différence de buts par match 25 %, matchs sans défaite 15 %. Chaque critère est rapporté au meilleur des dix.")+
 `<div class="grid g2 fade">${card("Le podium de la domination","Les trois champions les plus dominants",podium())}
 ${card("Indice ECR de domination","Score sur 100",hbar(DOM.map(c=>({c,v:c.dom,tip:`Indice ${c.dom}/100`}))))}
 ${card("Champion contre dauphin","Écart de points au classement final",dumbbell())}
 ${card("Attaque et défense","Buts marqués et encaissés par match",scatter())}
 ${card("Taux de victoire","Part des matchs de championnat gagnés",hbar(sorted("winp").map(c=>({c,v:c.winp,tip:`${c.W} V · ${c.D} N · ${c.L} D`})),{fmt:v=>NF(v,1),unit:" %"}))}
 ${card("Différence de buts","Buts marqués moins buts encaissés",hbar(sorted("gd").map(c=>({c,v:c.gd,tip:`${c.GF} marqués, ${c.GA} encaissés`})),{fmt:v=>"+"+NF(v)}))}
 ${card("Meilleure défense","Buts encaissés par match, moins = mieux",hbar(sorted("gapm",false).map(c=>({c,v:c.gapm,tip:`${c.GA} buts en ${c.P} matchs`})),{fmt:v=>NF(v,2)}))}
 ${card("Meilleure attaque","Buts marqués par match",hbar(sorted("gfpm").map(c=>({c,v:c.gfpm,tip:`${c.GF} buts en ${c.P} matchs`})),{fmt:v=>NF(v,2)}))}
 ${card("Le calendrier des sacres","Date du titre mathématique",timeline(),"span2")}
 ${card("Titres nationaux cumulés","Y compris 2025/26",hbar(sorted("title").map(c=>({c,v:c.title,tip:`${c.title} titres`}))))}
 ${card("Série en cours","Titres consécutifs",hbar(sorted("streak").map(c=>({c,v:c.streak,tip:`${c.streak} titre(s) d'affilée`}))))}</div>`;
const EUROHTML=()=>`<div class="grid g3">${EURO.map((e,i)=>`<section class="card" style="overflow:hidden;background:linear-gradient(160deg,${i===0?"#0b1f45":i===1?"#2a1606":"#062a1c"},var(--s1) 70%)"><div style="position:absolute;right:-10px;top:-6px;opacity:.12">${TROPHY(130,"#f0b429")}</div><div class="mono gold">${e.comp}</div><h3 style="font-size:26px;margin:10px 0 4px;letter-spacing:-.03em">${e.win}</h3><div style="font-family:Sora;font-size:18px;color:var(--ink2)">${e.score} <span class="mut">contre</span> ${e.opp}</div><p class="note">${e.venue} · ${e.date}<br>${e.extra}</p></section>`).join("")}</div>`;
pages.europe=()=>PH("03","Chapitre 3","Le test européen","Dominer chez soi ne suffit pas : jusqu'où les champions nationaux sont-ils allés en Europe ?")+
 `<div class="fade">${EUROHTML()}</div><div class="grid g2" style="margin-top:16px">${card("Parcours en Ligue des champions","Dernier tour atteint par chaque champion national",ladder())}
 <section class="card"><h3>Ce que dit le parcours</h3><p class="sub">Lecture des résultats</p>
 <div class="ins"><div class="n">1/10</div><div><b>Un seul champion national titré en Europe</b><p>Le PSG, vainqueur de Monaco, Chelsea (8-2), Liverpool (4-0) et du Bayern (6-5) avant la finale contre Arsenal.</p></div></div>
 <div class="ins"><div class="n">3</div><div><b>Trois champions dans le dernier carré</b><p>PSG, Arsenal et Bayern. Arsenal avait terminé premier de la phase de ligue avec 24 points sur 24.</p></div></div>
 <div class="ins"><div class="n">10-2</div><div><b>Le Bayern écrase l'Atalanta</b><p>Score cumulé des huitièmes, avant d'éliminer le Real Madrid (6-4) en quarts.</p></div></div>
 <div class="ins"><div class="n">7-5</div><div><b>Galatasaray sort la Juventus</b><p>En barrages, avant de tomber contre Liverpool en huitièmes.</p></div></div>
 <div class="ins"><div class="n">2-5</div><div><b>Le choc de Bodø</b><p>L'Inter, champion d'Italie, éliminé dès les barrages par Bodø/Glimt.</p></div></div></section></div>
 <div class="card" style="margin-top:16px"><h3>Carte des finales et des champions</h3><p class="sub">Les trois finales 2026 se sont jouées à Budapest, Istanbul et Leipzig</p><div class="mapc">${map(true)}</div></div>`;
pages.finances=()=>{const tot=CLUBS.reduce((a,c)=>a+c.rev,0);return PH("04","Chapitre 4","Finances et valorisation","Derniers comptes publiés (exercice 2024/25) et valeur d'entreprise 2026. Les comptes 2025/26 ne sont pas encore publiés par les clubs.")+
 `<div class="grid g3 fade" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))">${[[CNT(tot/1000,2," Md€"),"Revenus cumulés des dix champions"],["×"+NF(974.8/149.5,1),"Écart de revenus Barcelone / Porto"],["39,2 M€","Plus gros bénéfice : FC Porto"],[CNT(CLUBS.reduce((a,c)=>a+(c.ev||0),0)/1000,1," Md€"),"Valeur des 8 champions du top 32"]].map(([v,l])=>`<div class="card"><div style="font-family:Sora;font-weight:800;font-size:36px;letter-spacing:-.04em">${v}</div><div class="mut">${l}</div></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:16px">
 ${card("Revenus 2024/25","En millions d'euros",hbar(sorted("rev").map(c=>({c,v:c.rev,tip:`${NF(c.rev,1)} M€${c.revG!=null?` (${sgn(c.revG)} % sur un an)`:""}`}))))}
 ${card("Résultat net 2024/25","En millions d'euros",hbar(sorted("net").map(c=>({c,v:c.net,tip:`${sgn(c.net,1)} M€`})),{fmt:v=>sgn(v,1)}))}
 ${card("Valeur d'entreprise 2026","En millions d'euros",hbar(sorted("ev").map(c=>({c,v:c.ev,tip:`${NF(c.ev)} M€${c.evG!=null?` (${sgn(c.evG)} %)`:" (nouvel entrant)"}`}))))}
 ${card("Valeur et revenus","Multiple de valorisation",evscatter())}
 ${card("Coût d'un point","Revenus divisés par les points, en M€",hbar(sorted("cpp").map(c=>({c,v:c.cpp,tip:`${NF(c.rev,1)} M€ pour ${c.Pts} pts`})),{fmt:v=>NF(v,1)}))}
 ${card("Croissance de la valeur","Évolution sur un an, en %",hbar(sorted("evG").map(c=>({c,v:c.evG,tip:`${sgn(c.evG)} %`})),{fmt:v=>sgn(v),unit:" %"}))}
 ${card("Valeur estimée des effectifs","Estimation CIES Football Observatory, mars 2026, en M€",ciesbar()+`<p class="note">Le CIES ne publie pas d'estimation pour Porto, Galatasaray et le Celtic dans cette édition. À titre de comparaison boursière, le Celtic, seul champion coté, capitalise 168,9 M£ à la Bourse de Londres (17 septembre 2026).</p>`)}
 ${card("Croissance des revenus","Exercice 2023/24 comparé à 2024/25, en M€",growthChart()+`<p class="note">Revenus 2023/24 publiés pour Barcelone, le Bayern, le PSG, Arsenal et le Celtic ; reconstitués à partir de la croissance publiée pour l'Inter, Porto et le Club Brugge. PSV et Galatasaray : croissance non publiée.</p>`)}</div>
 <p class="note">Arsenal et Celtic publient en livres sterling (Arsenal : résultat avant impôt −1,4 M£ ; Celtic : revenus 143,6 M£, bénéfice après impôt 33,9 M£), convertis à environ 1,18 € pour 1 £. Porto : revenus opérationnels hors transferts. Barcelone : bénéfice ordinaire. n.d. : non publié.</p>`};
pages.club=id=>{
 const c=byId[id];if(!c)return pages.champions();const i=DOM.indexOf(c),prev=DOM[(i+9)%10],next=DOM[(i+1)%10];
 return `<section class="chead fade" style="background:${grad(c)}"><img class="wm" src="${LOGO[c.id]}" alt=""><div class="badge"><img src="${LOGO[c.id]}" alt="${esc(c.name)}"></div><div><div class="mono" style="color:rgba(255,255,255,.8)">${esc(c.league)} · ${esc(c.country)} · Champion 2025/26</div><h1>${esc(c.name)}</h1><div class="meta">Entraîneur <b>${esc(c.coach)}</b> · ${esc(c.stadium)}${c.cap?` (${NF(c.cap)} places)`:""} · ${esc(c.city)}</div><div class="tags"><span class="tag wt">${STAR(12)} ${c.title}e titre</span>${c.streak>1?`<span class="tag wt">${c.streak} titres d'affilée</span>`:""}${c.cups.map(x=>`<span class="tag wt">${esc(x)}</span>`).join("")}</div></div><div class="big"><span class="mono" style="color:rgba(255,255,255,.75)">Indice ECR</span><b>${c.dom}</b><span style="color:rgba(255,255,255,.8)">${rankOf(c,"dom")}e sur 10</span></div></section>
 <p style="font-family:Sora;font-size:20px;letter-spacing:-.015em;line-height:1.45;max-width:980px;margin:0 0 20px">${esc(c.note)}</p>
 <div class="facts">${[["Points",c.poPts?`${c.Pts} (${c.poPts} play-offs)`:c.Pts],["Bilan",`${c.W}V ${c.D}N ${c.L}D`],["Buts",`${c.GF} pour, ${c.GA} contre`],["Écart dauphin",`+${c.margin}`],["Dauphin",c.runner],["Titre acquis",c.clinched],["Meilleur buteur",c.scorer?`${c.scorer[0]} (${c.scorer[1]})`:"n.d."],["Revenus 24/25",`${NF(c.rev,1)} M€`],["Résultat net",c.net==null?"n.d.":`${sgn(c.net,1)} M€`],["Valeur 2026",c.ev?`${NF(c.ev)} M€`:"hors top 32"]].map(([a,b])=>`<div><span>${a}</span><b>${esc(b)}</b></div>`).join("")}</div>
 <div class="grid g2" style="margin-top:16px">${card("Profil de performance","Chaque axe de 0 à 100 à l'échelle des dix champions",radar(c))}
 <section class="card"><h3>Rang parmi les dix champions</h3><p class="sub">1 = meilleur</p>${[["Indice ECR","dom",true,c.dom],["Points par match","ppm",true,NF(c.ppm,2)],["Écart avec le dauphin","margin",true,"+"+c.margin],["Buts marqués par match","gfpm",true,NF(c.gfpm,2)],["Buts encaissés par match","gapm",false,NF(c.gapm,2)],["Revenus","rev",true,NF(c.rev)+" M€"],["Valeur d'entreprise","ev",true,c.ev?NF(c.ev)+" M€":"n.d."],["Parcours européen","ucl",true,c.cc==="POR"?"C3":STAGES[c.ucl]]].map(([l,k,d,v])=>{const r=c[k]==null?null:rankOf(c,k,d);return `<div class="rrow"><span>${l}</span><b>${v}</b><span class="tag ${r===1?"g":""}" style="justify-content:center">${r?r+"e":"n.d."}</span></div>`}).join("")}</section></div>
 <div class="card" style="margin-top:16px"><h3>Parcours européen</h3><p class="sub">${esc(c.uclTxt)} · Phase de ligue : ${esc(c.lp)}</p><div class="path">${c.path.map((p,j)=>{const last=j===c.path.length-1,won=last&&c.ucl===7,lost=last&&!won;return `<div class="step ${lost?"l":""} ${won?"w":""}"><div class="dot"></div><small>${esc(p[0])}</small><b>${esc(p[1])}</b><br><span class="pill">${esc(p[2])}</span></div>`}).join("")}${c.ucl===7?`<div class="step w"><div class="dot"></div><small>Sacre</small><b>Champion d'Europe</b><br><span class="pill">Budapest</span></div>`:""}</div></div>
 <div class="noprint" style="display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap"><a class="btn s" href="#/club/${prev.id}">← ${esc(prev.name)}</a><a class="btn s" href="#/duel/${c.id}/${c.id==="bay"?"psg":"bay"}">Comparer ce club</a><a class="btn s" href="#/club/${next.id}">${esc(next.name)} →</a></div>`;
};
pages.duel=(a="psg",b="bay")=>{
 const A=byId[a]||CLUBS[0],B=byId[b]||CLUBS[3],opt=s=>DOM.map(c=>`<option value="${c.id}" ${c.id===s.id?"selected":""}>${esc(c.name)}</option>`).join("");
 const M=[["Indice ECR","dom",1,0],["Points par match","ppm",1,2],["Écart avec le dauphin","margin",1,0],["Taux de victoire (%)","winp",1,1],["Buts marqués / match","gfpm",1,2],["Buts encaissés / match","gapm",0,2],["Différence de buts","gd",1,0],["Titres nationaux","title",1,0],["Parcours européen (0 à 7)","ucl",1,0],["Revenus 24/25 (M€)","rev",1,0],["Résultat net (M€)","net",1,1],["Valeur d'entreprise (M€)","ev",1,0]];
 let sa=0,sb=0;const rows=M.map(([l,k,hi,d])=>{const va=A[k],vb=B[k];if(va==null||vb==null)return `<div class="drow"><div class="a"><span>${va==null?"n.d.":NF(va,d)}</span></div><div class="m">${l}</div><div class="b"><span>${vb==null?"n.d.":NF(vb,d)}</span></div></div>`;
  const m=Math.max(Math.abs(va),Math.abs(vb))||1,wa=hi?va>vb:va<vb,wb=hi?vb>va:vb<va;sa+=wa;sb+=wb;
  return `<div class="drow"><div class="a ${wa?"win":""}"><span>${NF(va,d)}</span><div class="t" style="width:${Math.max(3,Math.abs(va)/m*100)}%"></div></div><div class="m">${l}</div><div class="b ${wb?"win":""}"><div class="t" style="width:${Math.max(3,Math.abs(vb)/m*100)}%"></div><span>${NF(vb,d)}</span></div></div>`}).join("");
 return PH("VS","Outil","Duel de champions","Deux clubs, douze indicateurs sportifs et financiers : le vainqueur de chaque ligne est surligné en or.")+
 `<section class="card fade"><div class="duelhead"><div class="dside">${L(A,96)}<select id="da" aria-label="Club A">${opt(A)}</select></div><div class="vs">${sa} : ${sb}<small>Indicateurs gagnés</small></div><div class="dside">${L(B,96)}<select id="db" aria-label="Club B">${opt(B)}</select></div></div><div style="margin-top:22px">${rows}</div><p class="note">Pour les buts encaissés, la valeur la plus basse l'emporte.</p></section>`;
};
let sortK="dom",sortD=true;
pages.tableau=()=>{
 const cols=[["Club","name",1],["Ligue","league",1],["Pts","Pts"],["Pts/m","ppm",0,2],["V","W"],["N","D"],["D","L"],["BP","GF"],["BC","GA"],["Diff","gd"],["Écart","margin"],["Indice","dom"],["Titres","title"],["Europe","ucl"],["Revenus M€","rev",0,1],["Net M€","net",0,1],["Valeur M€","ev"]];

 +panel("Les vendeurs gagnent",`<p class="note"><b>Porto</b> signe le meilleur résultat de son histoire (39,2 M€) grâce à 171,5 M€ de ventes de joueurs et à la cession de 30 % des droits économiques de son stade.</p><p class="note">L'<b>Inter</b> renoue avec le bénéfice pour la première fois en quinze ans (35,4 M€). Le <b>PSG</b>, malgré 837 M€ de revenus et la Ligue des champions, reste déficitaire de 40 M€. Le <b>Club Brugge</b> aligne son onzième exercice bénéficiaire d'affilée, et <b>Galatasaray</b> perd 887 M TL (−23 M€) avant de revenir au bénéfice l'exercice suivant.</p>`,"tint"),
 strip:[["+39,2 M€","Porto, record historique"],["+35,4 M€","Inter, 1er bénéfice en 15 ans"],["−40 M€","PSG"],["11","exercices bénéficiaires du Club Brugge"]]}),
P({ch:"Chapitre 4 · Économie",ck:CK.c4,t:"Valeur d'entreprise 2026",lede:"Huit des dix champions figurent dans le top 32 européen des valorisations. Le Celtic et le Club Brugge n'y entrent pas.",
 body:panel("Valeur d'entreprise, en M€",fit(hbar(sorted("ev").map(c=>({c,v:c.ev,tip:`${NF(c.ev)} M€`})),{ar:1.5})))
 +panel("Valeur rapportée aux revenus",fit(evscatter())),
 strip:[["5,9 Md€","Barcelone, +33 %"],["4,9 Md€","Arsenal, +23 %"],["+25 %","Inter et PSV"],["6×","le multiple des mieux valorisés"]]}),
P({ch:"Chapitre 4 · Économie",ck:CK.c4,t:"La valeur des effectifs",lede:"Estimation du CIES Football Observatory (mars 2026) : ce que vaudraient les joueurs sur le marché des transferts.",cols:"1.5fr 1fr",
 body:panel("",fit(ciesbar()))
 +panel("Un actif qui pèse plus que le chiffre d'affaires",`<p class="note">Le <b>Barça</b> (1,39 Md€), <b>Arsenal</b> (1,35 Md€) et le <b>PSG</b> (1,35 Md€) alignent des effectifs qui valent davantage que leurs revenus annuels. Le <b>PSV</b> (400 M€) et le <b>Club Brugge</b> (347 M€) valent plus de deux fois leur chiffre d'affaires : leur modèle est celui de la formation et de la revente.</p><p class="note">Le CIES ne publie pas d'estimation pour Porto, Galatasaray et le Celtic. Seul champion coté en Bourse, le <b>Celtic</b> capitalise 168,9 M£ à Londres au 17 septembre 2026.</p>`,"tint"),
 strip:[["1,39 Md€","l'effectif du Barça"],["347 M€","celui du Club Brugge"],["×2,3","effectif rapporté aux revenus du PSV"],["168,9 M£","capitalisation du Celtic"]]}),
P({ch:"Chapitre 4 · Économie",ck:CK.c4,t:"La croissance des revenus",lede:"Exercice 2023/24 comparé à 2024/25. Une saison européenne réussie change l'échelle d'un club.",cols:"1.5fr 1fr",
 body:panel("",fit(growthChart()))
 +panel("L'Europe fait la différence",`<p class="note">L'<b>Inter</b> signe la plus forte progression (+37 %) grâce à la finale de la Ligue des champions 2025 et à la Coupe du monde des clubs. <b>Barcelone</b> suit (+27 %), portée par un merchandising à 170 M€ et le retour au Spotify Camp Nou.</p><p class="note">Seul <b>Porto</b> recule (−14 %) : la Ligue Europa rapporte beaucoup moins que la Ligue des champions. Les revenus du club restent pourtant suffisants pour dégager le plus gros bénéfice des dix champions, grâce aux ventes de joueurs.</p>`,"tint"),
 strip:[["+37 %","Inter"],["+27 %","Barcelone"],["−14 %","Porto"],["8/10","champions en croissance ou stables"]]}),
P({ch:"Chapitre 4 · Économie",ck:CK.c4,t:"Ce que coûte un point",lede:"Revenus 2024/25 divisés par les points pris en championnat, en millions d'euros par point.",cols:"1.55fr 1fr",
 body:panel("",fit(hbar(sorted("cpp").map(c=>({c,v:c.cpp,tip:`${NF(c.rev,1)} M€ pour ${c.Pts} pts`})),{fmt:v=>NF(v,1),ar:2.25})))
 +panel("Le titre le moins cher d'Europe",`<p class="note">Un point de Ligue 1 coûte <b>11,0 M€</b> de revenus au PSG, contre <b>1,7 M€</b> à Porto et <b>2,0 M€</b> au PSV : un rapport de 1 à 6,5.</p><p class="note">Cet écart mesure moins l'efficacité d'un club que le poids économique de son championnat. Dans une ligue à un seul prétendant, la domination se paie beaucoup moins cher qu'en Premier League, où Arsenal a dû aligner 822 M€ de revenus pour devancer Manchester City de sept points.</p>`,"tint"),
 strip:[["11,0 M€","le point du PSG"],["1,7 M€","le point de Porto"],["×6,5","d'écart"],[NF(totPts),"points pris par les dix champions"]]})
].concat(DOM.map(c=>P({ch:"Fiches de club",ck:c.c1,t:esc(c.name),lede:`${esc(c.league)} · ${c.title}e titre national${c.streak>1?`, ${c.streak} d'affilée`:""} · Entraîneur : ${esc(c.coach)} · ${esc(c.stadium)}`,cols:"1.1fr 1fr 1fr",
 body:`<div class="panel" data-go="#/club/${c.id}" style="cursor:pointer;background:${grad(c)};color:#fff;border:0">
  <div style="display:flex;gap:1.2cqw;align-items:center"><div style="width:6.6cqw;height:6.6cqw;border-radius:50%;background:#fff;display:grid;place-items:center;padding:.85cqw;flex:none"><img src="${LOGO[c.id]}" style="width:100%;height:100%;object-fit:contain"></div><div style="width:5.6cqw;flex:none;opacity:.97;display:grid;place-items:center">${jersey(c,140).replace('width="140" height="140"','width="100%" height="100%"')}</div><div><div style="font-family:Sora;font-weight:800;font-size:3.6cqw;line-height:1">${c.dom}</div><div style="font-size:1cqw;opacity:.9">Indice ECR · ${rankOf(c,"dom")}e sur 10</div></div></div>
  <p style="font-size:1.15cqw;line-height:1.5;margin:1.1cqw 0 0;opacity:.96">${esc(c.note)}</p>
  <div style="margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:.6cqw;font-size:1.05cqw">${[["Points",c.poPts?`${c.Pts} (${c.poPts} PO)`:c.Pts],["Bilan",`${c.W}V ${c.D}N ${c.L}D`],["Buts",`${c.GF} / ${c.GA}`],["Écart",`+${c.margin}`],["Dauphin",esc(c.runner)],["Titre acquis",c.clinched]].map(([a,b])=>`<div style="border-top:.06cqw solid rgba(255,255,255,.3);padding-top:.35cqw"><div style="opacity:.8;font-size:.9cqw">${a}</div><b>${esc(b)}</b></div>`).join("")}</div></div>
 ${panel("Profil de performance",fit(radar(c)))}
 <div style="display:grid;grid-template-rows:1fr 1fr;gap:1.2cqw;min-height:0">
 ${panel("Parcours européen",`<p class="note" style="font-size:1.05cqw">${esc(c.uclTxt)}.</p><div style="margin-top:.4cqw;font-size:.92cqw">${c.path.map(p=>`<div style="display:grid;grid-template-columns:auto 1fr auto;gap:.6cqw;align-items:baseline;padding:.14cqw 0;border-bottom:.06cqw solid var(--line)"><span class="mut" style="font-size:.85cqw">${esc(p[0])}</span><b>${esc(p[1])}</b><span style="color:var(--ck);font-weight:700">${esc(p[2])}</span></div>`).join("")}</div>`,"tint")}
 ${panel("Économie",`<div style="display:grid;grid-template-columns:1fr 1fr;gap:.7cqw;font-size:1.05cqw">${[["Revenus 24/25",`${NF(c.rev,1)} M€`],["Résultat net",c.net==null?"n.d.":`${sgn(c.net,1)} M€`],["Valeur 2026",c.ev?`${NF(c.ev)} M€`:"hors top 32"],["Coût d'un point",`${NF(c.cpp,1)} M€`]].map(([a,b])=>`<div><div class="mut" style="font-size:.92cqw">${a}</div><b>${b}</b></div>`).join("")}</div>`)}
 </div>`,
 strip:[[`${c.poPts||c.Pts} pts`,`en ${c.P} matchs`],[`+${c.margin}`,`sur ${esc(c.runner)}`],[`${c.GF}/${c.GA}`,"buts marqués et encaissés"],[c.cc==="POR"?"Ligue Europa":STAGES[c.ucl],"en Europe"]]})))
.concat([P({ch:"Annexe",ck:CK.an,t:"Méthodologie et sources",lede:"Comment les chiffres ont été réunis, calculés et vérifiés.",
 body:panel("Périmètre et calculs",`<p class="note">Dix championnats européens, saison 2025/26, classements finaux. Finances : derniers comptes annuels publiés (exercice 2024/25). Valorisation : valeur d'entreprise publiée en mai 2026.</p><p class="note"><b>Indice ECR de domination</b> : chaque critère est divisé par la meilleure valeur des dix champions, puis pondéré (points par match 35 %, écart avec le dauphin par match 25 %, différence de buts par match 25 %, matchs sans défaite 15 %) et multiplié par 100.</p><p class="note">Les championnats comptent de 30 à 38 matchs et la Belgique joue des play-offs : tous les ratios sont exprimés par match. Arsenal et Celtic publient en livres sterling, convertis à environ 1,18 € pour 1 £. Porto : revenus opérationnels hors transferts. Barcelone : bénéfice ordinaire.</p><p class="note">Logos : propriété de leurs clubs respectifs, utilisés à titre d'identification.</p>`,"tint")
 +panel("Sources",`<div class="note">${SOURCES}</div><p class="note" style="margin-top:.9cqw">Rapport indépendant, sans lien avec les organismes cités. Données arrêtées en septembre 2026.<br><b>Conception, collecte et analyse : Abdoul Hamid Diallo, Data Engineer.</b></p>`),
 strip:[["10","championnats"],["2025/26","saison sportive"],["2024/25","exercice financier"],["Sept. 2026","arrêté des données"]]})]);
const rpage=(p,i)=>`<article class="rp ${p.dark?"dark":""}" style="${p.ck?`--ck:${p.ck}`:""}"><div class="in"><div class="hd"><span>${p.ch}</span><span><b>ECR 2026</b> · European Champions Report</span></div>${p.html()}<div class="ft"><span>${p.src||"European Champions Report 2026 · Sources en page "+RPAGES.length}</span><span>${i+1} / ${RPAGES.length}</span></div></div></article>`;
pages.rapport=(n="1")=>{
 if(n==="grille")return `<div class="fade"><div class="rbar noprint"><div><div class="mono gold">Vue d'ensemble</div><h2 style="font-family:Sora;font-size:26px;margin:4px 0 0;letter-spacing:-.03em">Les ${RPAGES.length} pages du rapport</h2></div><div style="display:flex;gap:8px"><a class="btn s" href="#/rapport/1">Mode lecture</a><button class="btn p" id="pdfg">Exporter en PDF</button></div></div><div class="pgrid">${RPAGES.map((p,j)=>`<a class="pcell" href="#/rapport/${j+1}"><div class="pmini">${rpage(p,j)}</div><span>${String(j+1).padStart(2,"0")} \u00b7 ${esc(p.t)}</span></a>`).join("")}</div></div>`;
 let i=Math.min(RPAGES.length,Math.max(1,parseInt(n)||1))-1;const p=RPAGES[i];
 const toc=RPAGES.map((q,j)=>`${j===0||q.ch!==RPAGES[j-1].ch?`<div class="ch mono" style="color:${q.ck||"var(--gold)"}">${q.ch}</div>`:""}<a href="#/rapport/${j+1}" class="${j===i?"on":""}"><span>${String(j+1).padStart(2,"0")}</span>${q.t}</a>`).join("");
 return `<div class="rwrap fade"><aside class="toc noprint">${toc}</aside><div><div class="rbar noprint"><div style="display:flex;gap:8px;align-items:center"><a class="btn s" href="#/rapport/${Math.max(1,i)}" ${i===0?'style="opacity:.4;pointer-events:none"':""}>←</a><a class="btn s" href="#/rapport/${Math.min(RPAGES.length,i+2)}" ${i===RPAGES.length-1?'style="opacity:.4;pointer-events:none"':""}>→</a><span class="mono mut">Page ${i+1} sur ${RPAGES.length} · ${esc(p.t)}</span></div><div style="display:flex;gap:8px"><a class="btn s" href="#/rapport/grille">Vue d’ensemble</a><button class="btn s" id="fs">Plein écran</button><button class="btn p" id="pdf">Exporter en PDF</button></div></div><div class="prog noprint"><i style="width:${(i+1)/RPAGES.length*100}%"></i></div><div id="rps" style="overflow:hidden"><div id="rpv">${rpage(p,i)}</div></div><p class="note noprint" id="rhint">Flèches ← et → pour tourner les pages. Les graphiques restent interactifs : survolez-les.</p></div></div>`;
};
// ---------- ROUTER ----------
const NAV=[["home","Accueil"],["rapport","Rapport"],["champions","Champions"],["domination","Domination"],["europe","Europe"],["decennie","Décennie"],["finances","Finances"],["duel","Duel"],["tableau","Données"],["methode","Méthode"]];
$("#tabs").innerHTML=NAV.map(([k,l])=>`<a href="#/${k==="home"?"":k==="rapport"?"rapport/1":k}" data-k="${k}" class="${k==="rapport"?"rep":""}">${l}</a>`).join("");
let cur="home";
function counters(){document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,d=+el.dataset.d||0,s=el.dataset.s||"";if(!isFinite(n))return;const t0=performance.now(),dur=900;
 const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=NF(n*e,d)+s;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function route(){
 const parts=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean),k=parts[0]||"home",fn=pages[k]||pages.home;
 cur=k;$("#app").innerHTML=fn(...parts.slice(1));
 document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.k===(k==="club"?"champions":k)));
 const on=$("#tabs a.on");if(on)on.scrollIntoView({block:"nearest",inline:"center"});
 const c=k==="club"&&byId[parts[1]];document.title=(c?c.name+" · ":"")+"European Champions Report 2026";
 if(k==="duel"){const go=()=>location.hash=`#/duel/${$("#da").value}/${$("#db").value}`;$("#da").onchange=go;$("#db").onchange=go}
 if(k==="tableau"){document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const kk=th.dataset.k;if(sortK===kk)sortD=!sortD;else{sortK=kk;sortD=true}route()});$("#csv").onclick=csv}
 if(k==="rapport"&&parts[1]==="grille"){const g=$("#pdfg");if(g)g.onclick=()=>{location.hash="#/rapport/1";setTimeout(()=>{const b=$("#pdf");if(b)b.click()},350)}}
 if(k==="rapport"&&parts[1]!=="grille"){
   $("#fs").onclick=()=>{const v=$("#rpv");(v.requestFullscreen?v.requestFullscreen():0)};
   $("#pdf").onclick=()=>{const v=$("#rpv"),w=$("#rps");v.style.width="";v.style.transform="";w.style.height="";v.innerHTML=RPAGES.map(rpage).join("");fitPanels(v);setTimeout(()=>{print();setTimeout(route,1500)},300)};
 }
 counters();fitRep();requestAnimationFrame(()=>fitPanels());scrollTo({top:0});
}
function fitPanels(root){(root||document).querySelectorAll(".rp .panel, .rp .fitbox").forEach(p=>{p.style.zoom="";let z=1,g=0;
 while(p.scrollHeight>p.clientHeight+2&&z>.62&&g++<14){z=+(z-.045).toFixed(3);p.style.zoom=z}})}
function fitRep(){const w=$("#rps"),v=$("#rpv");if(!w||!v)return;
 if(innerWidth<=760){const s=w.clientWidth/900;v.style.width="900px";v.style.transform=`scale(${s})`;v.style.transformOrigin="top left";w.style.height=Math.round(900*9/16*s)+"px"}
 else{v.style.width="";v.style.transform="";w.style.height=""}
 const hint=$("#rhint");if(hint)hint.textContent=innerWidth<=760?"Le rapport est en format paysage : tournez votre téléphone ou pincez pour zoomer. Les 26 pages sont aussi exportables en PDF.":"Flèches ← et → pour tourner les pages. Les graphiques restent interactifs : survolez-les.";}
addEventListener("resize",()=>{fitRep();fitPanels()});
function csv(){const k=["name","league","country","coach","P","W","D","L","GF","GA","Pts","runner","rPts","margin","dom","title","streak","ucl","rev","net","ev"];
 const t=[k.join(";")].concat(CLUBS.map(c=>k.map(x=>c[x]==null?"":String(c[x]).replace(".",",")).join(";"))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+t],{type:"text/csv"}));a.download="european-champions-report-2026.csv";a.click()}
addEventListener("hashchange",route);
addEventListener("keydown",e=>{
 if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))return;
 if(cur==="rapport"&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const n=parseInt(location.hash.split("/")[2]||"1");const m=e.key==="ArrowRight"?Math.min(RPAGES.length,n+1):Math.max(1,n-1);location.hash="#/rapport/"+m}
 if(e.key==="/"){e.preventDefault();const q=$("#q");if(q)q.focus()}});
// theme
const setT=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("ecr26-theme",t)}catch(e){}};
try{const t=localStorage.getItem("ecr26-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#theme").onclick=()=>setT(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#share").onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else{await navigator.clipboard.writeText(location.href);$("#share").title="Lien copié"}}catch(e){}};
// search
const si=$("#q"),sr=$("#sres"),norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
si.oninput=()=>{const q=norm(si.value.trim());if(!q){sr.style.display="none";return}
 const hits=CLUBS.filter(c=>norm([c.name,c.short,c.league,c.country,c.coach,c.city,c.stadium,c.runner,c.scorer?c.scorer[0]:""].join(" ")).includes(q));
 sr.innerHTML=hits.length?hits.map((c,i)=>`<a href="#/club/${c.id}" class="${i?"":"on"}">${L(c,28)}<span><b>${esc(c.name)}</b><br><small class="mut">${esc(c.league)} · ${esc(c.coach)}</small></span></a>`).join(""):`<div style="padding:12px" class="mut">Aucun résultat</div>`;
 sr.style.display="block"};
si.onkeydown=e=>{if(e.key==="Enter"){const a=sr.querySelector("a");if(a){location.hash=a.getAttribute("href");si.value="";sr.style.display="none";si.blur()}}if(e.key==="Escape"){si.value="";sr.style.display="none";si.blur()}};
document.addEventListener("click",e=>{if(!e.target.closest(".search"))sr.style.display="none"});
route();
})();
</script>
